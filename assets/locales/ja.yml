  key_reverse: "追従カメラの視点を反転 (前 <-> 後ろ)"
  cheatsheet_title: "フリーカメラ 操作ガイド"
  cheatsheet_contents: |
    # フリーカメラ 操作ガイド
    この機能は **レース** または **ライブコンサート** でのみ動作します。

    デフォルトの部位は **顔 (Face)** です。

    デフォルトのターゲットは **Place01** です。

    ## マウス操作
    * **右クリック + ドラッグ:** 視点を回す
    * **ホイール 上 / 下:** FOV 拡大 / 縮小

    ---

    ## ゲームパッド操作 (Xbox / PlayStation)

    ### **移動とカメラアングル**
    * **左スティック:** 前後左右へ移動
    * **右スティック:** 視点の操作 (左/右/上/下)
    * **Rトリガー (RT / R2):** 上へ移動
    * **Lトリガー (LT / L2):** 下へ移動
    * **Rショルダー / バンパー (RB / R1):** FOV 縮小
    * **Lショルダー / バンパー (LB / L1):** FOV 拡大

    ---

    ### アクションボタン
    * **Y** (△): カメラ位置をリセット
    * **X** (□): カメラモードを切り替え
    * **B** (○): 追従カメラの視点を反転 *(前 <-> 後ろ、追従カメラのみ)*
    * **A** (✕): ライブの一時停止 / 再開

    ---

    ### 十字キー操作 (フリー移動では使用不可)
    * **十字キー 右:** 次のターゲット *(追従カメラ & 一人称視点)*
    * **十字キー 左:** 前のターゲット *(追従カメラ & 一人称視点)*
    * **十字キー 上:** 次の部位 *(追従カメラのみ)*
    * **十字キー 下:** 前の部位 *(追従カメラのみ)*
