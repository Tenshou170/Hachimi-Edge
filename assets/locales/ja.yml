steam_overlay_conflict_dialog:
  title: "お知らせ"
  content: >-
    Hachimi のオーバーレイが有効な場合、購入が正常に行えないことがあります。
    購入時に Steam オーバーレイが表示された場合は、このメッセージを無視して「いいえ」を
    押してください。うまくいかない場合は「はい」を押して、一時的に Hachimi のオーバーレイを
    無効にしてください。ゲームが終了し、次回の起動時にはオーバーレイが無効化された状態で
    起動するため、購入できるようになります。その後、ゲームを再起動すればオーバーレイを
    再度有効にできます。
