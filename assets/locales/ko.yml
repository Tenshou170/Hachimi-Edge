  title: "알림"
  content: >-
    Hachimi 오버레이가 활성화된 상태에서는 결제가 작동하지 않을 수 있습니다. Steam 오버레이가 이미 결제를 위해 표시되었다면
    이 메시지를 무시하고 아니오를 누르세요. 작동하지 않았다면 예를 눌러 Hachimi 오버레이를 일시적으로 비활성화하세요.
    게임이 종료되며, 다음 실행 시 Hachimi 오버레이가 비활성화된 상태로 결제를 진행할 수 있습니다. 이후 게임을 다시 시작하면 오버레이가 재활성화됩니다.
