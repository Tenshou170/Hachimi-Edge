  key_reverse: "추적 카메라 시점 반전 (앞 <-> 뒤)"
  cheatsheet_title: "프리 카메라 조작 가이드"
  cheatsheet_contents: |
    # 프리 카메라 조작 가이드
    이 기능은 **레이스** 또는 **라이브 콘서트**에서만 동작합니다.

    기본 신체 부위는 **얼굴(Face)**입니다.

    기본 대상은 **Place01**입니다.

    ## 마우스 조작
    * **우클릭 드래그:** 시점 둘러보기
    * **휠 위 / 아래:** FOV 확대 / 축소

    ---

    ## 게임패드 조작 (Xbox / PlayStation)

    ### **이동 및 시점**
    * **왼쪽 조이스틱:** 전후좌우 이동
    * **오른쪽 조이스틱:** 시점 조절 (좌/우/상/하)
    * **오른쪽 트리거 (RT / R2):** 위로 상승
    * **왼쪽 트리거 (LT / L2):** 아래로 하강
    * **오른쪽 숄더 / 범퍼 (RB / R1):** FOV 축소
    * **왼쪽 숄더 / 범퍼 (LB / L1):** FOV 확대

    ---

    ### 버튼 기능
    * **Y** (△): 카메라 위치 리셋
    * **X** (□): 카메라 모드 전환
    * **B** (○): 추적 시점 반전 *(앞 <-> 뒤, 추적 카메라 전용)*
    * **A** (✕): 라이브 일시정지 / 재개

    ---

    ### 방향 패드 조작 (자유 이동 모드에서는 사용 불가)
    * **D-Pad 우:** 다음 대상 *(추적 카메라 & 1인칭 시점)*
    * **D-Pad 좌:** 이전 대상 *(추적 카메라 & 1인칭 시점)*
    * **D-Pad 상:** 다음 신체 부위 *(추적 카메라 전용)*
    * **D-Pad 하:** 이전 신체 부위 *(추적 카메라 전용)*
