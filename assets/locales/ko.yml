first_time_setup:
  title: "초기 설정"
  welcome_heading: "환영합니다"
  welcome_content: >-
    Hachimi가 설치되었습니다! 초기 설정 과정을 안내해 드립니다.
    번역 기능을 사용하지 않으시려면 이 대화상자를 닫아 건너뛸 수 있습니다.


    면책 조항: Hachimi는 커뮤니티 주도 프로젝트입니다. 모든 번역은 다양한 커뮤니티 기여자에 의해 작성되었습니다.
    Cygames, Inc.에서 개발하거나 보증하지 않으며 게임 이용약관을 위반할 수 있습니다.
    계속 진행하면 사용에 따른 모든 위험을 감수하는 것으로 간주됩니다.
  translation_repo_heading: "번역 저장소"
  select_translation_repo: "번역 저장소를 선택하세요:"
  no_compatible_repo: "이 게임 버전과 호환되는 번역 저장소가 없습니다."
  skip_translation: "번역 건너뛰기"
  common_settings_heading: "주요 설정"
  common_settings_content: >-
    핵심 게임플레이 및 시각적 설정을 구성합니다.
    설정 편집기에서 언제든지 변경할 수 있습니다.
  complete_heading: "모든 준비 완료!"
  complete_content: >-
    완료를 클릭하여 설정을 저장합니다.
    번역 저장소를 선택한 경우 업데이트 확인이 진행되며,
    새 번역 데이터를 다운로드하도록 안내합니다.

