  cheatsheet_title: "Hướng dẫn nhanh Camera Tự do"
  cheatsheet_contents: |
    # Hướng dẫn nhanh Camera Tự do
    Tính năng này chỉ hoạt động trong **Cuộc đua** hoặc **Buổi biểu diễn Live**.

    Bộ phận cơ thể mặc định là **Face**.

    Mục tiêu mặc định là **Place01**.

    ## Điều khiển chuột
    * **Giữ Chuột phải + Kéo:** Nhìn xung quanh
    * **Cuộn chuột Lên / Xuống:** Tăng FOV / Giảm FOV

    ---

    ## Điều khiển tay cầm (Xbox / PlayStation)

    ### **Di chuyển & Góc camera**
    * **Cần điều khiển trái:** Di chuyển trái / phải / tiến / lùi
    * **Cần điều khiển phải:** Nhìn trái / phải / lên / xuống
    * **Cò phải (RT / R2):** Di chuyển lên
    * **Cò trái (LT / L2):** Di chuyển xuống
    * **Nút vai phải (RB / R1):** Giảm FOV
    * **Nút vai trái (LB / L1):** Tăng FOV

    ---

    ### Nút hành động
    * **Y** (Tam giác): Đặt lại vị trí camera
    * **X** (Vuông): Chuyển chế độ camera
    * **B** (Tròn): Đảo góc nhìn camera theo dõi *(trước <-> sau, chỉ Theo dõi Nhân vật)*
    * **A** (Chữ X): Tạm dừng / tiếp tục live

    ---

    ### Điều khiển D-Pad (Không khả dụng trong Di chuyển tự do)
    * **D-Pad Phải:** Mục tiêu tiếp theo *(Theo dõi Nhân vật & Góc nhìn thứ nhất)*
    * **D-Pad Trái:** Mục tiêu trước đó *(Theo dõi Nhân vật & Góc nhìn thứ nhất)*
    * **D-Pad Lên:** Bộ phận tiếp theo *(chỉ Theo dõi Nhân vật)*
    * **D-Pad Xuống:** Bộ phận trước đó *(chỉ Theo dõi Nhân vật)*

