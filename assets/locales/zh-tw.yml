    遊戲將重新啟動以套用更新內容。
  android_content: |
    偵測到 Hachimi Edge 的新版本 (%{version})。是否更新？
    點擊「是」將跳轉至 UmaPatcher Edge，在其中重新為當前遊戲補丁以更新 Hachimi。
    (無需重新下載完整遊戲檔案或 APK，重新為當前遊戲版本的 APK 補丁並安裝即可，UmaPatcher Edge 將自動下載最新版本的 Hachimi Edge。)


