  cheatsheet_title: "自由視角快速指南"
  cheatsheet_contents: |
    # 自由視角快速指南
    本功能僅在 **比賽** 或 **Live 舞台** 中生效。

    預設跟隨部位為 **頭部**。

    在比賽中預設跟隨 **1號閘位**。

    ## 滑鼠操作
    * **按住右鍵並拖曳：** 旋轉視角
    * **滾輪向上 / 向下：** 調整 FOV

    ---

    ## 手把操作 (Xbox / PlayStation)

    ### **移動與視角**
    * **左搖桿：** 移動
    * **右搖桿：** 旋轉視角
    * **右扳機鍵 (RT / R2)：** 上升
    * **左扳機鍵 (LT / L2)：** 下降
    * **右側肩鍵 (RB / R1)：** 減小 FOV
    * **左側肩鍵 (LB / L1)：** 增大 FOV

    ---

    ### 功能按鍵
    * **Y鍵** (三角)：重設相機位置
    * **X鍵** (方形)：切換相機模式
    * **B鍵** (圓圈)：翻轉跟隨視角方向 *(前 <-> 後，僅跟隨角色模式)*
    * **A鍵** (交叉)：暫停 Live

    ---

    ### 十字鍵控制 (自由移動模式下不可用)
    * **十字鍵-左：** 上一個目標 *(僅跟隨角色與第一人稱)*
    * **十字鍵-右：** 下一個目標 *(僅跟隨角色與第一人稱)*
    * **十字鍵-上：** 下一個部位 *(僅跟隨角色)*
    * **十字鍵-下：** 上一個部位 *(僅跟隨角色)*
