  cheatsheet_title: "Guía rápida de Cámara Libre"
  cheatsheet_contents: |
    # Guía rápida de Cámara Libre
    Esta función solo está disponible en **Carreras** o **Conciertos en vivo**.

    La parte del cuerpo predeterminada es **Face**.

    El objetivo predeterminado es **Place01**.

    ## Controles de ratón
    * **Mantener Clic Derecho + Arrastrar:** Mirar alrededor
    * **Rueda de desplazamiento Arriba / Abajo:** Aumentar FOV / Disminuir FOV

    ---

    ## Controles de mando (Xbox / PlayStation)

    ### **Movimiento y ángulo de cámara**
    * **Stick izquierdo:** Mover izquierda / derecha / adelante / atrás
    * **Stick derecho:** Mirar izquierda / derecha / arriba / abajo
    * **Gatillo derecho (RT / R2):** Mover hacia arriba
    * **Gatillo izquierdo (LT / L2):** Mover hacia abajo
    * **Botón superior derecho (RB / R1):** Disminuir FOV
    * **Botón superior izquierdo (LB / L1):** Aumentar FOV

    ---

    ### Botones de acción
    * **Y** (Triángulo): Restablecer posición de la cámara
    * **X** (Cuadrado): Cambiar modo de cámara
    * **B** (Círculo): Invertir perspectiva de seguimiento *(frontal <-> trasera, solo Seguir Personaje)*
    * **A** (Cruz): Pausar / reanudar concierto

    ---

    ### Controles de cruceta (No disponible en Movimiento Libre)
    * **Cruceta Derecha:** Objetivo siguiente *(Seguir Personaje y Primera Persona)*
    * **Cruceta Izquierda:** Objetivo anterior *(Seguir Personaje y Primera Persona)*
    * **Cruceta Arriba:** Siguiente parte del cuerpo *(solo Seguir Personaje)*
    * **Cruceta Abajo:** Parte del cuerpo anterior *(solo Seguir Personaje)*

