  cheatsheet_title: "Cheatsheet sa Free Camera"
  cheatsheet_contents: |
    # Cheatsheet sa Free Camera
    Gumagana lang ang feature na ito sa **Mga Karera** o **Live Concerts**.

    Ang default na bahagi ng katawan ay ang **Face**.

    Ang default na target ay **Place01**.

    ## Mouse Controls
    * **Hold Right Click + Drag:** Tumingin
    * **Scroll Wheel Up / Down:** Itaas o ibaba ang FOV

    ---

    ## Gamepad Controls (Xbox / PlayStation)

    ### **Paggalaw at Anggulo ng Camera**
    * **Left Joystick:** Lumipat nang pakaliwa / pakanan / diretso / paatras
    * **Right Joystick:** Tumingin nang pakaliwa / pakanan / pataas / pababa
    * **Right Trigger (RT / R2):** Lumipat pataas
    * **Left Trigger (LT / L2):** Lumipat pababa
    * **Right Shoulder / Bumper (RB / R1):** Itaas ang FOV
    * **Left Shoulder / Bumper (LB / L1):** Ibaba ang FOV

    ---

    ### Action Buttons
    * **Y** (Triangle): I-reset ang camera position
    * **X** (Square): Cycle camera mode
    * **B** (Circle): Baliktaran ang follow camera perspective *(front <-> back, Follow Camera lang)*
    * **A** (Cross): I-pause / i-resume ang concert

    ---

    ### D-Pad Controls (Hindi available sa Free Move)
    * **D-Pad Right:** Susunod na target *(Follow Camera at First Person)*
    * **D-Pad Left:** Nakaraang target *(Follow Camera at First Person)*
    * **D-Pad Up:** Susunod na bahagi ng katawan *(Follow Camera lang)*
    * **D-Pad Down:** Nakaraang bahagi ng katawan *(Follow Camera lang)*
