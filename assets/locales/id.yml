  cheatsheet_title: "Panduan Cepat Kamera Bebas"
  cheatsheet_contents: |
    # Panduan Cepat Kamera Bebas
    Fitur ini hanya berfungsi di **Balapan** atau **Konser Live**.

    Bagian tubuh default adalah **Face**.

    Target default adalah **Place01**.

    ## Kontrol Mouse
    * **Tahan Klik Kanan + Geser:** Melihat sekeliling
    * **Scroll Wheel Atas / Bawah:** Tingkatkan FOV / Kurangi FOV

    ---

    ## Kontrol Gamepad (Xbox / PlayStation)

    ### **Gerakan & Sudut Kamera**
    * **Joystick Kiri:** Bergerak kiri / kanan / maju / mundur
    * **Joystick Kanan:** Melihat kiri / kanan / atas / bawah
    * **Trigger Kanan (RT / R2):** Bergerak ke atas
    * **Trigger Kiri (LT / L2):** Bergerak ke bawah
    * **Bumper Kanan (RB / R1):** Kurangi FOV
    * **Bumper Kiri (LB / L1):** Tingkatkan FOV

    ---

    ### Tombol Aksi
    * **Y** (Segitiga): Reset posisi kamera
    * **X** (Kotak): Ganti mode kamera
    * **B** (Lingkaran): Balikkan perspektif kamera ikuti *(depan <-> belakang, hanya Ikuti Karakter)*
    * **A** (Silang): Jeda / lanjutkan konser

    ---

    ### Kontrol D-Pad (Tidak tersedia di Gerakan Bebas)
    * **D-Pad Kanan:** Target berikutnya *(Ikuti Karakter & Orang Pertama)*
    * **D-Pad Kiri:** Target sebelumnya *(Ikuti Karakter & Orang Pertama)*
    * **D-Pad Atas:** Bagian tubuh berikutnya *(hanya Ikuti Karakter)*
    * **D-Pad Bawah:** Bagian tubuh sebelumnya *(hanya Ikuti Karakter)*

