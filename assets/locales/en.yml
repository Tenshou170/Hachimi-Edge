    A new Hachimi Edge update is available (%{version}). Do you want to install it?

    Tap "Yes" to open UmaPatcher Edge and re-patch your current game.
    (No full game or APK re-download required, you only need to patch again like you normally would as UmaPatcher Edge always downloads the latest Hachimi Edge version.)

