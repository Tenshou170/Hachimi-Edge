steam_overlay_conflict_dialog:
  title: "Внимание"
  content: >-
    Внутриигровые покупки могут не работать с включённым оверлеем Hachimi. Если оверлей Steam уже
    открылся для совершения покупки, пожалуйста, проигнорируйте это сообщение и нажмите «Нет».
    Если же он не появился, нажмите «Да», чтобы временно отключить оверлей Hachimi. Игра закроется,
    а при следующем запуске оверлей Hachimi будет отключён, и вы сможете совершить покупку.
    После этого вы можете снова перезапустить игру, чтобы вернуть оверлей Hachimi.

