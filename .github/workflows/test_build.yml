name: Test Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'README-*.md'
      - 'BUILDING.md'
      - 'BUILDING-*.md'
      - '.gitignore'
      - 'rustfmt.toml'
      - '.github/**'
      - 'assets/locales/**'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Grant execute permission to build scripts
        run: chmod +x tools/android/*.sh tools/windows/*.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Hachimi for Android
        run: |
          rustup target add aarch64-linux-android
          bash tools/android/build.sh
        env:
          HACHIMI_IGNORE_DIRTY: "false"
          RELEASE: "1"

      - name: Attest Android
        uses: actions/attest@v4
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            build/*.so
            build/sha256.json

      - name: Upload Android binaries
        uses: actions/upload-artifact@v7
        with:
          name: android-test
          path: |
            build/*.so
            build/sha256.json

  build-zygisk:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    steps:
      - uses: actions/checkout@v7
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2

      - name: Grant execute permission to build scripts
        run: chmod +x tools/android/*.sh tools/windows/*.sh
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Hachimi Zygisk Module
        run: |
          rustup target add aarch64-linux-android
          RELEASE=1 ./tools/android/build_zygisk.sh
        env:
          HACHIMI_IGNORE_DIRTY: "false"

      - name: Attest Zygisk Module
        uses: actions/attest@v4
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            build/zygisk-*.zip

      - name: Upload Zygisk Module
        uses: actions/upload-artifact@v7
        with:
          name: zygisk-test
          path: |
            build/zygisk-*.zip

  build-windows:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[ci skip]')"
    env:
      CFLAGS_x86_64_pc_windows_msvc: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CXXFLAGS_x86_64_pc_windows_msvc: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CFLAGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
      CXXFLAGS: "-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          prefix-key: x86_64-pc-windows-msvc

      - name: Setup Windows MSVC Cross-Compile Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-19 lld-19 llvm-19
          echo "/usr/lib/llvm-19/bin" >> $GITHUB_PATH
          for tool in clang clang++ clang-cl lld lld-link ld.lld llvm-ar llvm-lib; do
            if [ -f "/usr/lib/llvm-19/bin/$tool" ]; then
              sudo ln -sf "/usr/lib/llvm-19/bin/$tool" "/usr/local/bin/$tool"
            elif command -v "$tool" >/dev/null 2>&1; then
              sudo ln -sf "$(which "$tool")" "/usr/local/bin/$tool"
            fi
          done
          if [ ! -f /usr/local/bin/llvm-lib ]; then
            if [ -f /usr/lib/llvm-19/bin/llvm-ar ]; then
              sudo ln -sf /usr/lib/llvm-19/bin/llvm-ar /usr/local/bin/llvm-lib
            elif command -v llvm-ar >/dev/null 2>&1; then
              sudo ln -sf "$(which llvm-ar)" /usr/local/bin/llvm-lib
            fi
          fi

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Cache cargo-xwin MSVC CRT & Windows SDK
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: ${{ runner.os }}-xwin-cache-v1

      - name: Build Hachimi for Windows
        run: |
          mkdir -p build
          cargo xwin build --target x86_64-pc-windows-msvc --target-dir build --release
          mv build/x86_64-pc-windows-msvc/release/hachimi.dll build/
        env:
          HACHIMI_IGNORE_DIRTY: "false"
          RELEASE: "1"

      - name: Build Cellar
        run: |
          git clone --depth 1 --revision d4c3f79801c8131e26df585766c35e5ce11ec57f https://github.com/Hachimi-Hachimi/Cellar
          cd Cellar
          cargo xwin build --target x86_64-pc-windows-msvc --target-dir build --release
          mv build/x86_64-pc-windows-msvc/release/cellar.dll build/
          cd ..

      - name: Check out FunnyHoney
        run: git clone --depth 1 --revision 418b5348bd9b7376cc7485c591ca69d49aa4d805 https://gitlab.com/LeadRDRK/FunnyHoney.git

      - name: Build Installer
        run: |
          git clone --depth 1 --revision 0387eb987aa9bc446415844e321125dff16e210f https://github.com/teiosteppa/Installer
          cp build/hachimi.dll Installer/
          mv Cellar/build/cellar.dll Installer/
          mv FunnyHoney/FunnyHoney.exe Installer/
          cd Installer
          cargo xwin build --target x86_64-pc-windows-msvc --target-dir build --release --features compress_bin
          cd ..
          mv Installer/build/x86_64-pc-windows-msvc/release/hachimi_installer.exe build/

      - name: Get checksums for Windows binaries
        run: |
          cargo install b3sum --locked --version 1.8.6
          DLL_HASH=$(b3sum --no-names build/hachimi.dll)
          EXE_HASH=$(b3sum --no-names build/hachimi_installer.exe)
          cat <<EOF > build/blake3.json
          {
            "hachimi.dll": "$DLL_HASH",
            "hachimi_installer.exe": "$EXE_HASH"
          }
          EOF

      - name: Attest Windows
        uses: actions/attest@v4
        if: github.event_name != 'pull_request'
        with:
          subject-path: |
            build/blake3.json
            build/hachimi.dll
            build/hachimi_installer.exe

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v7
        with:
          name: windows-test
          path: |
            build/blake3.json
            build/hachimi.dll
            build/hachimi_installer.exe
